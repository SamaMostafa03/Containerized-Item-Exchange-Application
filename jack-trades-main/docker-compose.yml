version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: jack-trades-db
    environment:
      POSTGRES_USER: ${DB_USER:-jackuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jackpass}
      POSTGRES_DB: jack_trades_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jackuser -d jack_trades_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jack-trades-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jack-trades-backend
    volumes:
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./server:/app/server
      - node_modules_backend:/app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8000}
      DEV_DB_URL: postgres://${DB_USER:-jackuser}:${DB_PASSWORD:-jackpass}@postgres:5432/jack_trades_dev
      TEST_DB_URL: postgres://${DB_USER:-jackuser}:${DB_PASSWORD:-jackpass}@postgres:5432/jack_trades_test
      DATABASE_URL: postgres://${DB_USER:-jackuser}:${DB_PASSWORD:-jackpass}@postgres:5432/jack_trades_prod
      SECRET_TOKEN: ${SECRET_TOKEN:-your-secret-key-here}
      JACK_TRADES: http://frontend:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jack-trades-network
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    container_name: jack-trades-frontend-dev
    working_dir: /app/client
    volumes:
      - ./client:/app/client
      - node_modules_frontend:/app/client/node_modules
    environment:
      - REACT_APP_API_URL=http://backend:8000/api/v1
    ports:
      - "3000:3000"
    command: sh -c "rm -rf node_modules/.package-lock.json && npm ci && npm start"
    depends_on:
      - backend
    networks:
      - jack-trades-network
    restart: unless-stopped

volumes:
  postgres_data:
  node_modules_backend:
  node_modules_frontend:

networks:
  jack-trades-network:
    driver: bridge
