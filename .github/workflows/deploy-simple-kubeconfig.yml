name: Build and Deploy to K3s using kubeconfig

on:
  push:
    branches:
      - main


env:
  AWS_REGION: us-east-1      # ← MUST be us-east-1
  AWS_DEFAULT_REGION: us-east-1
  ECR_REGISTRY_ALIAS: a9o4o2s3
  ECR_REPOSITORY: jack-backend
  K8S_NAMESPACE: jack-trades-ns
  
jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR Public
      id: login-ecr-public
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Build, tag, and push image to Amazon ECR Public
      env:
        REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
        REGISTRY_ALIAS: a9o4o2s3
        REPOSITORY: jack-backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f jack-trades-main/Dockerfile.backend -t $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG  jack-trades-main
        docker tag $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
                   $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:latest
        docker push $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
        docker push $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:latest
        echo "IMAGE=$REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_ENV


  deploy:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Deploy to K3s
      run: |
        kubectl set image deployment/jack-trades-backend \
          jack-trades-backend=public.ecr.aws/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
          -n ${{ env.K8S_NAMESPACE }}
        
        kubectl rollout status deployment/jack-trades-backend -n ${{ env.K8S_NAMESPACE }}
        kubectl get pods -n ${{ env.K8S_NAMESPACE }}
