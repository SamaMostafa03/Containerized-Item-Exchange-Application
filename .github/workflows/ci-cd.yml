name: CI/CD Pipeline

on:
   workflow_dispatch: 

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY_ALIAS: a9o4o2s3
  ECR_REPOSITORY: jack-backend

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
      
    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint || echo "Linting skipped"

    - name: Run tests
      run: npm test || echo "Tests skipped"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR Public
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Build and push Docker image
      id: build-image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        IMAGE_URI=$REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
        docker build -t $IMAGE_URI .
        docker tag $IMAGE_URI $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:latest
        docker push $IMAGE_URI
        docker push $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:latest
        echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT


  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.jack-trades.com


    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name jack-trades-staging --region ${{ env.AWS_REGION }}

    - name: Deploy to staging
      run: |
        kubectl apply -f k8s/ -n jack-trades-staging
        kubectl set image deployment/jack-trades-backend jack-trades-backend=${{ needs.build.outputs.image }} -n jack-trades-staging
        kubectl rollout status deployment/jack-trades-backend -n jack-trades-staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://jack-trades.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name jack-trades-prod --region ${{ env.AWS_REGION }}

    - name: Run migrations
      run: |
        kubectl delete job jack-trades-db-migrate --ignore-not-found=true -n jack-trades-ns
        kubectl apply -f k8s/migration-job.yaml -n jack-trades-ns
        kubectl wait --for=condition=complete --timeout=300s job/jack-trades-db-migrate -n jack-trades-ns

    - name: Run migrations
      run: |
        kubectl delete job jack-trades-db-migrate --ignore-not-found=true -n jack-trades-ns
        kubectl apply -f k8s/migration-job.yaml -n jack-trades-ns
        kubectl wait --for=condition=complete --timeout=300s job/jack-trades-db-migrate -n jack-trades-ns

    - name: Deploy to production
      run: |
        kubectl apply -f k8s/ -n jack-trades-ns
        kubectl set image deployment/jack-trades-backend jack-trades-backend=${{ needs.build.outputs.image }} -n jack-trades-ns
        kubectl rollout status deployment/jack-trades-backend -n jack-trades-ns

    - name: Run smoke tests
      run: |
        kubectl run smoke-test --rm -i --restart=Never --image=curlimages/curl -- curl -f http://jack-trades-backend-service:8000/health || exit 1
