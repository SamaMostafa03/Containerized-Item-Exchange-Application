name: Build and Deploy to K3s using ssh

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY_ALIAS: a9o4o2s3
  ECR_BACKEND_REPOSITORY: jack-backend
  ECR_FRONTEND_REPOSITORY: jack-frontend
  K8S_NAMESPACE: jack-trades-ns
  
jobs:
  build-backend:
    name: Build and Push Backend Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR Public
      id: login-ecr-public
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public
        
    - name: Build, tag, and push backend image
      env:
        REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f jack-trades-main/Dockerfile.backend -t $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_BACKEND_REPOSITORY }}:$IMAGE_TAG jack-trades-main
        docker tag $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_BACKEND_REPOSITORY }}:$IMAGE_TAG \
                   $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_BACKEND_REPOSITORY }}:latest
        docker push $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_BACKEND_REPOSITORY }}:$IMAGE_TAG
        docker push $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_BACKEND_REPOSITORY }}:latest
        
        echo "Backend image pushed successfully!"

   
  build-frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR Public
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Build, tag, and push frontend image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build the frontend using Dockerfile.frontend
        docker build \
          -f jack-trades-main/Dockerfile.frontend \
          -t $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_FRONTEND_REPOSITORY }}:$IMAGE_TAG \
          jack-trades-main

        docker tag $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_FRONTEND_REPOSITORY }}:$IMAGE_TAG \
                   $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_FRONTEND_REPOSITORY }}:latest

        docker push $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_FRONTEND_REPOSITORY }}:$IMAGE_TAG
        docker push $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_FRONTEND_REPOSITORY }}:latest
        
        echo "✅ Frontend image pushed successfully!"


  deploy:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
  # NEW STEP: Copy k8s files to server
    - name: Copy k8s manifests to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.K3S_HOST }}
        username: ${{ secrets.K3S_USER }}
        key: ${{ secrets.K3S_SSH_KEY }}
        source: "jack-trades-main/k8s/*"
        target: "/tmp/k8s-deploy"
        strip_components: 1
    
    - name: Deploy to K3s via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.K3S_HOST }}
        username: ${{ secrets.K3S_USER }}
        key: ${{ secrets.K3S_SSH_KEY }}
        port: 22
        script: |
          # Stop the script if any command fails
          set -e
         
         
          # ============================================
          echo "=== Running Database Migration ==="
          # ============================================
         
          kubectl delete job jack-trades-db-migrate --ignore-not-found=true -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f ~/Containerized-Item-Exchange-Application/jack-trades-main/k8s/migration-job.yaml -n ${{ env.K8S_NAMESPACE }}
          if kubectl wait --for=condition=complete --timeout=5m job/jack-trades-db-migrate -n ${{ env.K8S_NAMESPACE }}; then
            echo "Migration completed successfully"
          else
            echo "Migration failed or timed out"

            # Show the logs from the failed migration so we can debug
            kubectl logs job/jack-trades-db-migrate -n ${{ env.K8S_NAMESPACE }} --tail=30
            exit 1
          fi
          


          # ============================================
          echo "=== Updating Backend Deployment ==="
          
          # Tell Kubernetes to update the backend deployment with the new image
          # This triggers a rolling update: new pods start, old pods terminate
          kubectl set image deployment/jack-trades-backend \
            backend=public.ecr.aws/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          
          echo "=== Waiting for Rollout ==="

          # Wait for the backend rollout to complete (max 10 minutes)
          if kubectl rollout status deployment/jack-trades-backend -n ${{ env.K8S_NAMESPACE }} --timeout=10m; then
            echo "Backend deployment successful"
          else
            echo "Backend deployment failed"
            # Show details about what went wrong
            kubectl describe deployment jack-trades-backend -n ${{ env.K8S_NAMESPACE }}
            exit 1
          fi


          # ============================================
          # Step 3: Update Frontend Deployment
          # ============================================
          echo ""
          echo " Updating Frontend Deployment..."


          # Tell Kubernetes to update the frontend deployment with the new image
          kubectl set image deployment/jack-trades-frontend \
            frontend=public.ecr.aws/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}



          # Wait for the frontend rollout to complete (max 10 minutes)
          if kubectl rollout status deployment/jack-trades-frontend -n ${{ env.K8S_NAMESPACE }} --timeout=10m; then
            echo "✅ Frontend deployment successful"
          else
            echo "❌ Frontend deployment failed"
            # Show details about what went wrong
            kubectl describe deployment jack-trades-frontend -n ${{ env.K8S_NAMESPACE }}
            exit 1
          fi


           # ============================================
          # Step 4: Verify Everything is Running
          # ============================================
          echo ""
          echo "📋 Final Deployment Status:"
          echo "================================================"
          
          # Show all pods in your namespace
          echo ""
          echo "Running Pods:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          
          # Show all services (how traffic reaches your apps)
          echo ""
          echo "Services:"
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}
          
          echo ""
          echo "================================================"
          echo "✅ Full Stack Deployment Complete!"
          echo "================================================"


