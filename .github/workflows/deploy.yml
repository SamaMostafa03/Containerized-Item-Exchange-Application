name: Build and Deploy to K3s

on:
  push:
    branches:
      - main


env:
  AWS_REGION: us-east-1
  ECR_REGISTRY_ALIAS: a9o4o2s3
  ECR_REPOSITORY: jack-backend
  K8S_NAMESPACE: jack-trades-ns
  
jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR Public
      id: login-ecr-public
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Build, tag, and push image to Amazon ECR Public
      env:
        REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
        REGISTRY_ALIAS: a9o4o2s3
        REPOSITORY: jack-backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
        docker tag $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
                   $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:latest
        docker push $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
        docker push $REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:latest
        echo "IMAGE=$REGISTRY/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_ENV


  deploy:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to K3s via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.K3S_HOST }}
        username: ${{ secrets.K3S_USER }}
        key: ${{ secrets.K3S_SSH_KEY }}
        port: 22
        script: |
          # Update deployment with new image
          kubectl set image deployment/jack-trades-backend \
            jack-trades-backend=public.ecr.aws/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          
          # Wait for rollout
          kubectl rollout status deployment/jack-trades-backend -n ${{ env.K8S_NAMESPACE }}
          
          # Show status
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Run Database Migration
      run: |
        kubectl delete job jack-trades-db-migrate --ignore-not-found=true -n ${{ env.K8S_NAMESPACE }}
        kubectl apply -f k8s/migration-job.yaml -n ${{ env.K8S_NAMESPACE }}
        kubectl wait --for=condition=complete --timeout=300s job/jack-trades-db-migrate -n ${{ env.K8S_NAMESPACE }}

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/ -n ${{ env.K8S_NAMESPACE }}
        kubectl rollout restart deployment/jack-trades-backend -n ${{ env.K8S_NAMESPACE }}
        kubectl rollout status deployment/jack-trades-backend -n ${{ env.K8S_NAMESPACE }}
  
    - name: Verify deployment
      run: |
        kubectl get pods -n ${{ env.K8S_NAMESPACE }}
        kubectl get svc -n ${{ env.K8S_NAMESPACE }}
